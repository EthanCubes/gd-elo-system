<!DOCTYPE html>
<html>
    <head>
        <title>Geometry Dash Elo System | Player Search and Skill Rating Calculator</title>
        <link rel="stylesheet" href="src/styles.css">
        <link rel="icon" href="favicon.ico">
    </head>
    <body>
        <h1>Geometry Dash ELO System</h1>
        <div>
            <label for="query">Search for a player</label>
            <input type="text" id="query">
            <br>
            <div id="buttons">
                <button id="search">Search!</button>
                <button id="lucky">I'm feeling lucky</button>
            </div>
        </div>

        <div id="loading"><h1>Loading...</h1></div>
        <div id="info">
            <!--The information here is placeholder-->
            <h1 id="name">wPopoff</h1>
            <h2 id="elo">21772</h2>
            <h3 id="stars">Stars: 3185</h3>
            <h3 id="moons">Moons: 104</h3>
            <h3 id="secretCoins">Secret Coins: 28</h3>
            <h3 id="userCoins">User Coins: 103</h3>
            <h3 id="easyDemons">Easy Demons: 64</h3>
            <h3 id="mediumDemons">Medium Demons: 21</h3>
            <h3 id="hardDemons">Hard Demons: 13</h3>
            <h3 id="insaneDemons">Insane Demons: 30</h3>
            <h3 id="extremeDemons">Extreme Demons: 73</h3>
        </div>
        <footer>
            <a href="https://www.geometrydash.com">Geometry Dash Official Website</a>
            &nbsp;
            <a href="https://www.github.com/EthanCubes/gd-elo-system">Check out this project on GitHub</a>
        </footer>
        <script src="src/script.js"></script>
    </body>
</html>
